<style>
:root{--page:#f5f5f1;--paper:#fff;--ink:#263e35;--text:#34483e;--muted:#778379;--line:#e3e8df;--green:#345d49;--soft:#edf4eb;--radius:18px}

header{padding:28px 0 23px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line)}.brand{width:46px;height:49px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--ink)}.brand svg{width:26px;height:29px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green);margin-bottom:2px}h1{font-size:27px;letter-spacing:.4px;line-height:1.35;margin:0;color:var(--ink)}.byline{font-size:12px;color:var(--muted);margin-top:4px}
main{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(330px,1fr);align-items:start;gap:23px;padding:24px 0 30px}.choices{min-width:0;display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:21px 23px}.card h2{color:var(--ink);font-size:17px;line-height:1.4;margin:0 0 16px;display:flex;align-items:center;gap:9px}.card h2 small{font-size:12px;font-weight:400;color:var(--muted)}.index{font-size:11px;color:#8e9f8d;font-weight:500;letter-spacing:.7px;margin-right:1px}.label{font-size:12px;color:var(--muted);display:block;margin:15px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:14px;line-height:1.45;display:inline-flex;align-items:center;justify-content:center;gap:7px}.chip[aria-pressed=true],.layout[aria-pressed=true],.palette[aria-pressed=true]{color:var(--ink);border-color:#5c8166;background:var(--soft);box-shadow:inset 0 0 0 .5px #5c8166}.chip[aria-pressed=true]:not(:disabled):hover,.layout[aria-pressed=true]:hover,.palette[aria-pressed=true]:hover{background:#e4eee1;border-color:#5c8166}.chips.multi .chip:before{content:'＋';font-size:14px;color:#96a38f;width:12px}.chips.multi .chip[aria-pressed=true]:before{content:'✓';color:var(--green);font-size:13px}.chips.ratios .chip{padding:7px 11px;min-height:38px;font-size:13px}.layouts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.layout{background:#fff;border:1px solid var(--line);border-radius:11px;min-height:96px;padding:11px 3px 9px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:7px;font-size:12px;white-space:nowrap}.layout svg{width:46px;height:39px}.palettes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.palette{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 9px;min-height:46px;display:flex;align-items:center;justify-content:flex-start;gap:9px;font-size:13px}.swatches{display:flex;flex:none}.swatches i{width:13px;height:19px}.swatches i:first-child{border-radius:3px 0 0 3px}.swatches i:last-child{border-radius:0 3px 3px 0}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin:10px 0 0;min-height:0}.hint:empty{display:none}.custom-label{font-size:13px;font-weight:500;display:block;color:var(--muted);margin:17px 0 8px}.extra{width:100%;min-height:64px;resize:vertical;display:block;border:1px solid var(--line);background:#fcfdfa;border-radius:9px;padding:10px 12px;font-size:14px;line-height:1.6;color:var(--text)}.extra::placeholder{color:#97a28f}
.output{position:sticky;top:22px;padding:24px 22px 20px;min-width:0}.output-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.output-head h2{margin:0;font-size:18px}.lang{display:flex;gap:2px;background:#f0f3ec;padding:3px;border-radius:8px}.lang button{min-height:30px;padding:4px 9px;line-height:1.4;background:none;border:0;border-radius:5px;font-size:12px}.lang button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px #263e3510;color:var(--ink);font-weight:600}.output-caption{font-size:12px;color:var(--muted);margin:0 0 16px}.summary{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}.summary span{padding:3px 8px;background:#f1f5ee;border-radius:5px;font-size:11px;color:#657960}.prompt{display:block;width:100%;height:clamp(280px,calc(100dvh - 435px),600px);min-height:230px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:15px 14px;background:#f9fbf6;line-height:1.9;font-size:13px;color:#445846;overflow-y:auto}.copy{width:100%;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;padding:12px 15px;min-height:48px;margin:13px 0 0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;justify-content:center}.copy:not(:disabled):hover{background:#3b5a48;border-color:#3b5a48}.copy svg{width:16px;height:16px}.output-note{font-size:11px;color:var(--muted);line-height:1.8;margin:13px 1px 0}.footer{padding:16px 0 24px;border-top:1px solid var(--line);font-size:11px;color:#85917e}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#263e35;color:#fff;z-index:20;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:11px;box-shadow:0 6px 24px #22332222;font-size:14px;line-height:1.6;pointer-events:none}.mobile-result{display:none}.noscript{margin:20px;padding:18px;background:#fff4de;color:#70521b}
@media(min-width:1400px){.wrap{padding:0 40px}main{gap:26px}}
@media(max-width:1120px){.wrap{padding:0 24px}main{grid-template-columns:minmax(0,1.65fr) minmax(315px,1fr);gap:17px}.card{padding:19px}.layouts{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{min-height:87px;flex-direction:row;white-space:normal;gap:6px;font-size:11px}.layout svg{width:34px;height:36px;flex:none}.palette{font-size:12px;gap:6px;padding:10px 6px}.swatches i{width:9px}.chip{font-size:13px}}
@media(max-width:800px){.wrap{padding:0 16px}header{padding:20px 0 18px}h1{font-size:24px}.byline{font-size:11px}main{display:block;padding-top:16px}.choices{gap:12px}.card{padding:19px 18px}.card h2{font-size:17px}.layouts{grid-template-columns:repeat(6,minmax(0,1fr))}.layout{flex-direction:column;min-height:90px;font-size:11px;gap:7px}.layout svg{width:42px}.chip{font-size:14px;min-height:43px}.palette{font-size:13px;padding:12px 9px;gap:8px}.swatches i{width:12px}.output{position:static;margin-top:15px;scroll-margin-top:15px}.prompt{height:330px;font-size:14px}.copy{min-height:50px}.output-note{font-size:12px}.mobile-result{display:block;position:fixed;right:16px;bottom:14px;z-index:10;text-decoration:none;color:#fff;background:var(--ink);border-radius:100px;padding:11px 16px;font-size:13px;box-shadow:0 4px 13px #263e3525}.footer{padding-bottom:80px}.toast{bottom:74px}}
@media(max-width:520px){.wrap{padding:0 12px}.card{padding:18px 15px}.layouts{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{min-height:85px;flex-direction:row;gap:7px;font-size:12px}.layout svg{width:35px;height:38px}.palettes{grid-template-columns:repeat(2,minmax(0,1fr))}.palette{font-size:13px}.chip{padding:8px 11px}.chips{gap:7px}.brand{width:41px;height:46px}header{gap:12px}h1{font-size:23px}.eyebrow{font-size:9px;letter-spacing:1.5px}.chips.ratios .chip{font-size:12px;padding:7px 9px}.output{padding:20px 17px}}
@media(prefers-reduced-motion:reduce){button:not(:disabled){transition:none}}

<div class="wrap">
<header><div class="brand" aria-hidden="true"><svg viewBox="0 0 28 32" fill="none" stroke="#fff" stroke-width="1.2"><rect x="2" y="2" width="24" height="28" rx="1"/><rect x="6" y="6" width="16" height="10"/><path d="M6 21h6v5H6zM16 21h6M16 24h6M16 27h6"/></svg></div><div><div class="eyebrow">ARCHITECTURE BOARD STUDIO</div><h1>競圖展板提示詞</h1><div class="byline">馮世人｜朝陽科技大學建築系</div></div></header>
<main>
<div class="choices">
<section class="card" aria-labelledby="layoutHeading"><h2 id="layoutHeading"><span class="index">01</span>版面配置</h2><div class="layouts" id="layoutChoices" role="group" aria-label="版面配置，單選"></div><span class="label">尺寸／比例</span><div class="chips ratios" id="formatChoices" role="group" aria-label="尺寸與比例，單選"></div></section>
<section class="card" aria-labelledby="paletteHeading"><h2 id="paletteHeading"><span class="index">02</span>色彩風格</h2><div class="palettes" id="paletteChoices" role="group" aria-label="色彩風格，單選"></div></section>
<section class="card" aria-labelledby="styleHeading"><h2 id="styleHeading"><span class="index">03</span>圖面語彙</h2><div class="chips" id="styleChoices" role="group" aria-label="圖面語彙，單選"></div></section>
<section class="card" aria-labelledby="lightHeading"><h2 id="lightHeading"><span class="index">04</span>光影氛圍</h2><div class="chips" id="lightChoices" role="group" aria-label="光影氛圍，單選"></div><p class="hint" id="lightHint"></p></section>
<section class="card" aria-labelledby="drawingHeading"><h2 id="drawingHeading"><span class="index">05</span>圖面內容 <small>可複選</small></h2><div class="chips multi" id="drawingChoices" role="group" aria-label="圖面內容，可複選，再點一次取消"></div><label class="custom-label" for="extra">補充要求（選填）</label><textarea class="extra" id="extra" maxlength="2400" rows="2" placeholder="有其他想法再填寫"></textarea></section>
</div>
<aside class="card output" id="result" aria-labelledby="resultHeading"><div class="output-head"><h2 id="resultHeading">你的提示詞</h2><div class="lang" role="group" aria-label="提示詞語言"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">English</button></div></div><p class="output-caption">單張照片 → 完整展板。</p><div class="summary" id="summary" aria-hidden="true"></div><textarea class="prompt" id="prompt" readonly spellcheck="false" aria-label="完整提示詞"></textarea><button type="button" class="copy" id="copyBtn"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="6" width="10" height="12" rx="2"/><path d="M13 6V4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span id="copyLabel">複製提示詞</span></button><p class="output-note">複製後另附原始建築／空間照片。<br>衍生圖面為設計示意，非實測或施工圖。</p></aside>
</main>
<footer class="footer">競圖展板提示詞・完整成品修正版｜僅組合提示詞，不生圖、不上傳資料。</footer>
</div>
<a class="mobile-result" id="mobileResult" href="#result">查看提示詞 ↓</a><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/*
 * 馮世人｜競圖展板提示詞，完整成品修正版，2026-10-17。
 * 參考原版的任務及圖面架構，程式與提示詞重新撰寫，非複製原站版型。
 * 參考：https://jochien99.github.io/arch-poster/
 * 對照來源：jochien99/arch-poster，index.html，buildPrompt()。
 * 來源 SHA：88572f4f54a2f8c48f5e6bfac95d47ac1f957e4f。
 * 關鍵修正：照片是設計參考，不是只能重排的唯一圖面。
 * 缺少實測圖時仍完成設計示意，不輸出待填圖框；圖名使用一般製圖名稱，文字實際完成。
 * 所有配色及圖示只用於本工具的操作介面，不作為生成影像素材。
 */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const DATA={
 layout:{top:['主圖在上','hero at the top'],left:['主圖在左','hero on the left'],center:['中央主圖','a central hero'],grid:['均等網格','an equal modular grid'],story:['連續敘事','a sequential visual narrative'],collage:['自由拼貼','an asymmetric editorial collage']},
 format:{A1p:['A1 直式','A1 portrait',594,841],A1l:['A1 橫式','A1 landscape',841,594],A0p:['A0 直式','A0 portrait',841,1189],A0l:['A0 橫式','A0 landscape',1189,841],A2p:['A2 直式','A2 portrait',420,594],A2l:['A2 橫式','A2 landscape',594,420],wide:['16:9','16:9',16,9],square:['1:1','1:1',1,1]},
 style:{keep:['原圖風格','source-matched visual character'],photo:['寫實＋分析','photographic spatial views and analytical drawings'],collage:['競圖拼貼','architectural editorial collage'],technical:['黑白線稿','monochrome architectural drawing'],watercolor:['淡彩手繪','subtle watercolor and fine linework'],white:['全白素模','white study-model representation']},
 light:{keep:['沿用原圖','source-matched lighting'],day:['自然日光','natural daylight'],soft:['柔和光影','soft diffuse light'],sunset:['夕陽暖光','warm sunset light'],blue:['藍調時刻','blue-hour lighting'],night:['夜間燈光','nighttime lighting']},
 drawing:{hero:['主視覺','Hero view'],site:['基地分析','Visible-site relationships'],concept:['概念圖','Concept diagram'],master:['總平面','Site plan'],plan:['平面圖','Floor plan'],elevation:['立面圖','Elevation'],section:['剖面圖','Section'],axon:['軸測圖','Axonometric overview'],explode:['爆炸圖','Exploded layers'],circulation:['動線分析','Circulation diagram'],ecology:['環境策略','Environmental strategy'],detail:['構造細部','Detail studies'],material:['材質與光','Material and light study'],narrative:['概念短文','Concept narrative']}
};
const PALETTES={
 forest:{label:'森林綠・暖白',en:'forest green and warm white',colors:['#344d3e','#9eaf8c','#ecebe1']},
 mono:{label:'黑白・灰階',en:'black, white and grayscale',colors:['#252b29','#949b96','#eaece8']},
 earth:{label:'砂岩・木質',en:'sandstone and warm timber tones',colors:['#766148','#bda17c','#eee6d7']},
 blue:{label:'科技藍・灰',en:'muted technology blue and concrete gray',colors:['#3b566a','#8aadb9','#e1e6e5']},
 rose:{label:'淡粉・玫瑰金',en:'muted blush and rose gold',colors:['#875b5b','#c99891','#f1e7e2']},
 brass:{label:'黃銅・暖金',en:'brass and warm gold',colors:['#6f5437','#b58b52','#efe8d8']}
};
const layouts={top:[[3,2,44,22,1],[3,28,20,13,0],[27,28,20,13,0]],left:[[3,2,25,39,1],[32,2,15,17,0],[32,23,15,18,0]],center:[[3,2,9,39,0],[16,2,18,39,1],[38,2,9,39,0]],grid:[[3,2,20,17,0],[27,2,20,17,0],[3,23,20,18,0],[27,23,20,18,0]],story:[[3,2,22,25,1],[29,2,18,11,0],[29,17,18,10,0],[3,31,44,10,0]],collage:[[3,2,25,23,1],[32,5,15,17,0],[3,29,18,12,0],[25,26,22,15,0]]};

// 與舊版分開儲存，避免「僅重排、全部待補」的舊預設延續到修正版。
const STORAGE='feng-arch-board-complete-v4';
const initial=()=>({layout:'top',format:'A1p',palette:'forest',style:'collage',light:'soft',drawing:['hero','axon','explode','plan','section','detail','material','narrative'],extra:'',lang:'zh'});
let state=initial(),prompts={zh:'',en:''},timer;
const owns=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function normalize(raw){
 const s=initial();if(!raw||typeof raw!=='object'||Array.isArray(raw))return s;
 for(const k of ['layout','format','style','light'])if(typeof raw[k]==='string'&&owns(DATA[k],raw[k]))s[k]=raw[k];
 if(typeof raw.palette==='string'&&owns(PALETTES,raw.palette))s.palette=raw.palette;
 if(Array.isArray(raw.drawing)){
  const valid=[...new Set(raw.drawing.filter(v=>typeof v==='string'&&owns(DATA.drawing,v)))];
  if(valid.length)s.drawing=valid;
 }
 if(typeof raw.extra==='string')s.extra=raw.extra.slice(0,2400);
 if(raw.lang==='en')s.lang='en';return s;
}
try{state=normalize(JSON.parse(localStorage.getItem(STORAGE)||'null'));}catch(_){/* 儲存受限不影響操作。 */}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawControls(){
 $('#layoutChoices').innerHTML=Object.entries(DATA.layout).map(([key,item])=>`<button type="button" class="layout" data-group="layout" data-value="${key}" aria-pressed="false"><svg viewBox="0 0 50 45" aria-hidden="true">${layouts[key].map(([x,y,w,h,d])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="${d?'#577660':'#d6e0d0'}"/>`).join('')}</svg><span>${item[0]}</span></button>`).join('');
 $('#paletteChoices').innerHTML=Object.entries(PALETTES).map(([key,p])=>`<button type="button" class="palette" data-group="palette" data-value="${key}" aria-pressed="false"><span class="swatches" aria-hidden="true">${p.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>${p.label}</span></button>`).join('');
 for(const g of ['format','style','light','drawing'])$('#'+g+'Choices').innerHTML=Object.entries(DATA[g]).map(([k,v])=>`<button type="button" class="chip" data-group="${g}" data-value="${k}" aria-pressed="false">${v[0]}</button>`).join('');
 $('#extra').value=state.extra;
}
const spatialDrawings=()=>state.drawing.some(k=>['hero','axon','explode'].includes(k));
function lightReason(){
 if(state.style==='keep')return '原圖風格保留原有光影；衍生圖面仍會完成。';
 if(state.style==='technical')return '黑白線稿以線條與灰階表現，不加入實景燈光。';
 if(!spatialDrawings())return '光影用於主視覺、軸測圖或爆炸圖。';
 return '';
}

// 每一類都描述實際要畫什麼，不僅列出圖面名稱。
const CONTENT={
 hero:[
  '依參考照片製作完整主視覺，忠實保留量體輪廓、可見樓層、柱列、窗帶、開口與主要材料關係；清理影像雜訊並強化細節。不以另一棟建築取代，也不把整張參考截圖連同介面貼上。表現方式依下方風格設定。',
  'Produce a finished primary view grounded in the reference, preserving the visible silhouette, levels, column rhythm, window bands, openings and material relationships. Improve clarity without substituting a different building or pasting an entire interface screenshot. Follow the selected representation style.'
 ],
 axon:[
  '實際繪製同一建築／空間的完整軸測總圖：地坪、主結構、外牆或隔間、開口及屋頂相互對位，交代實體與挑空關係；用清楚線重和局部淡色凸顯層次。不可見部分依同一套空間邏輯簡化處理。',
  'Draw a complete axonometric overview of the same subject. Align floor surfaces, primary structure, enclosure or partitions, openings and roof, making solids and voids readable. Use distinct line weights and restrained shading. Simplify unseen parts using the same spatial logic across views.'
 ],
 explode:[
  '完成有實際構件的爆炸分層圖。依照片判斷外觀或室內，分解為約四組相應層次：外觀可用地坪／基座、柱梁／樓板、外殼／開口、屋頂；室內可用地坪、家具／展示、牆體、天花／燈具。層層沿同一軸線分離，以投影線對位並加短標註，不用幾個空方框代替構件。',
  'Produce an exploded assembly containing actual geometric components, typically in four relevant groups. For an exterior: ground/base, columns-beams-slabs, envelope/openings, roof. For an interior: floor, furniture/display, partitions, ceiling/lighting. Separate layers along a shared axis with projection guides and brief labels; do not replace components with empty rectangles.'
 ],
 plan:[
  '繪製與可見柱列、外輪廓及入口關係一致的平面示意，畫出牆、柱、開口、實體／開放區與簡化動線；以相對比例組織不可見部分，圖名直接使用「平面圖」。不要冒充原建築的實測平面，也不要為了看似專業添加無依據的尺寸。',

function generate(lang){
 const en=lang==='en',idx=en?1:0,out=[],s=state,p=PALETTES[s.palette];
 const add=(z,e)=>out.push(en?e:z),pair=v=>out.push(v[idx]);
 const physical=!['wide','square'].includes(s.format),f=DATA.format[s.format];
 const selected=['hero','concept','axon','explode','plan','section','elevation','detail','material','site','master','circulation','ecology','narrative'].filter(k=>s.drawing.includes(k));
 const hasDerivedViews=selected.some(k=>['site','concept','master','plan','elevation','section','axon','explode','circulation','ecology','detail'].includes(k));

 add('請扮演建築展板設計師。以我附上的建築／空間照片為設計參考，直接生成一張圖面、圖說及文字皆已完成的競圖海報。這是完整成品生成，不是原圖重排，也不是供人填寫的版型。',
     'Act as an architectural presentation designer. Use my attached building or spatial photograph as the design reference and generate one finished competition poster with completed drawings, captions and typography. Create a finished composition, not a photo rearrangement or a fill-in template.');
 add('即使只提供一張照片，也要完成以下選定內容。請先辨識照片的可見空間關係，在內部建立一致的簡化幾何，再繪製各張衍生圖面並整合排版。每個選定圖面區都應有可辨識的形體與資訊，不得以空白框、虛線格、裝飾線或低對比淡影代替。',
     'Complete the selected content below even when only one reference photograph is supplied. First interpret the visible spatial relationships, internally form a consistent simplified geometric model, then draw the derived views and compose the poster. Every selected drawing area must contain recognizable geometry and information, not empty frames, dashed grids, decorative strokes or near-invisible ghost diagrams.');

 add('\n【同一建築與空間一致性】','\n[SAME SUBJECT AND SPATIAL CONSISTENCY]');
 add('所有圖面都必須來自同一建築／空間：可見外輪廓、柱列、窗帶、開口、主要材料及高低關係保持一致，不引入其他房間或另一棟建築。若已附平面／剖面等原圖，對應內容以原圖為準；參考照片中的介面按鈕、相框或舊展板空框不是設計內容。',
     'Keep every view about the same building or space, preserving visible outline, column rhythm, window bands, openings, major materials and level relationships. Do not introduce unrelated rooms or another building. Where source plans or sections are supplied, follow them for the corresponding content. Interface buttons, frames and old empty poster boxes in a screenshot are not part of the design.');
 if(hasDerivedViews)add('不可見的內部、背面或接合，允許作必要且簡化的設計延伸，以完成所選圖面；各視圖必須共用一致的空間邏輯。圖名直接使用一般製圖名稱，圖旁只保留圖名與必要的構件、材料或空間註記。省略無依據的精確尺寸、比例尺、北向與性能數值；衍生內容屬設計示意，不宣稱為實測或施工依據。',
     'Unseen interiors, rear portions and joints may be developed only as much as needed for a simplified design study, using the same spatial logic across views. Use plain standard drawing titles and only necessary component, material or spatial notes beside the drawings. Omit unsupported precise dimensions, scale bars, north directions and performance numbers. Derived content is a design illustration, not measured or construction documentation.');

 add('\n【成品版面】','\n[FINISHED COMPOSITION]');
 add(`格式：${f[0]}${physical?`（${f[2]} × ${f[3]} mm 的長寬比例）`:''}，單張、正面平視，完整呈現展板四邊，不是展場、相框或手持海報照片。`,
     `Format: ${f[1]}${physical?` (aspect ratio corresponding to ${f[2]} × ${f[3]} mm)`:''}. Show one complete flat, front-facing board, not an exhibition scene, framed presentation or handheld poster photograph.`);
 if(selected.length===1){
  add(`本次只有「${DATA.drawing[selected[0]][0]}」一項，使用完整主區域呈現它，搭配必要標題與圖說；不預留其他未選圖面的空位。`,
      `Only "${DATA.drawing[selected[0]][1]}" is selected. Give it the main content area with necessary title and captions. Do not leave empty areas for unselected modules.`);
 }else{
  pair(COMPOSITION[s.layout]);
  if(!selected.includes('hero')&&s.layout!=='grid')add('未選主視覺，版面中的主要位置改由所選圖面中最適合者使用，不額外新增透視照片。',
     'No hero view is selected. Use the most suitable selected drawing in the primary position; do not add an unselected perspective photograph.');
 }
 add('圖面間留白用來分組與呼吸，不等於把整個內容區留空。線條、剖填與短圖說保持足夠對比；少用外框和粗色條，不出現用來填寫的格線。',
     'Use whitespace to separate and organize finished content, not to leave entire content zones empty. Keep linework, sectional fills and captions legible. Minimize enclosing boxes and heavy color bars; do not show a fill-in grid.');
 add(`色彩：${p.label}。以淺色底、黑灰線稿及少量重點色統一編排，點綴色用於分析、引線與標題；主視覺的建築材料不因此任意換色，白模表現除外。`,
     `Palette: ${p.en}. Use a light background, dark/gray linework and restrained accents for analysis, leaders and headings. Do not arbitrarily recolor the building materials, except as part of the selected white-model representation.`);
 pair(STYLE[s.style]);
 if(spatialDrawings()&&s.style!=='technical'){
  pair(LIGHT[lightReason()?'keep':s.light]);
  add('光影設定只作用於空間視圖，不把技術線稿變成寫實夜景或讓線條消失。',
      'Apply lighting to spatial views only, not as photorealistic night scenery over technical drawings or as an effect that erases their lines.');
 }

 add('\n【必須實際完成的內容】','\n[CONTENT TO ACTUALLY DRAW AND TYPESET]');
 selected.forEach((key,i)=>{
  out.push(`${i+1}. ${DATA.drawing[key][idx]}\n${CONTENT[key][idx]}`);
 });
 if(selected.length>10)add('內容較多，請將相關圖面編成有層級的小組，減少重複視圖；仍須讓每個選定主題有實際內容與可讀圖說。',
     'There are many selected modules. Group related studies hierarchically and reduce redundant views while keeping actual content and legible captions for every selected topic.');

 add('\n【文字直接排入成品】','\n[ACTUAL TYPOGRAPHY]');
 add('根據照片的可見特徵擬一個簡短主標，直接排入每張圖的簡短圖名、必要的構件、材料與引線註記；文字內容必須與旁邊的圖面相符。主標、圖名、內文有清楚大小層級，不用假文字或空白橫線充當文字，不預留大塊待填文字區。',
     'Write a concise overall title grounded in visible features. Typeset short drawing titles, necessary component names, material notes and leader annotations next to the actual content. Establish a clear title/caption/body hierarchy. Do not substitute pseudo-text, blank text lines or large unfilled text zones.');
 add('預設使用精簡的台灣繁體中文；英文提示詞不代表展板要改成英文。只有確實無法清楚呈現某段中文字時，才以意思相同的短英文替代，保留實際文字而非留白。不要自行添加設計者姓名、學校、建築正式名稱、地址、認證或標誌。',
     'Use concise Traditional Chinese for Taiwan by default; an English prompt does not request an English-language board. Only when a specific Chinese phrase cannot be rendered legibly, replace it with a short equivalent English label instead of leaving it blank. Do not invent designer names, schools, official building names, addresses, certifications or logos.');
 if(s.extra.trim()){
  add('\n【我指定的補充內容】','\n[MY ADDITIONAL INSTRUCTIONS — ORIGINAL WORDING]');
  out.push(s.extra.trim());
  add('以上補充優先於預設美術安排，但仍須維持同一建築與各圖面的一致性，並完成成品內容。',
      'Apply these instructions ahead of default art direction, while keeping the same subject, maintaining consistency across drawings and completing the actual poster content.');
 }
 add('\n【輸出前確認】','\n[FINAL CHECK]');
 add('逐一檢查所選圖面與短文是否真的完成；若仍有空圖框、假圖表、空白文字帶，先補成實際內容再輸出。只輸出一張完成的海報影像，不附製作說明或步驟。以可用的最高解析度生成，長邊以 4096 px 以上為目標；實際像素與印刷尺寸仍以輸出檔案為準。',
     'Check that every selected drawing and text block is actually complete. Replace any remaining empty image frames, fake charts or blank text bands with actual content before delivery. Return only one finished poster image, without an explanatory preamble or process steps. Use the highest available image resolution, targeting a long edge of at least 4096 px; actual pixels and print dimensions are determined by the delivered file.');
 return out.join('\n');
}

function render(){
 const reason=lightReason();if(reason)state.light='keep';
 for(const b of $$('[data-group]')){
  const g=b.dataset.group,v=b.dataset.value,on=g==='drawing'?state.drawing.includes(v):state[g]===v;
  b.setAttribute('aria-pressed',String(on));
  if(g==='light'){b.disabled=!!reason&&v!=='keep';b.title=b.disabled?reason:'';}
 }
 for(const b of $$('[data-lang]'))b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang));
 $('#lightHint').textContent=reason;
 prompts={zh:generate('zh'),en:generate('en')};
 const box=$('#prompt');box.value=prompts[state.lang];box.lang=state.lang==='zh'?'zh-Hant-TW':'en';
 $('#summary').innerHTML=[DATA.format[state.format][0],DATA.layout[state.layout][0],PALETTES[state.palette].label].map(v=>`<span>${esc(v)}</span>`).join('');
 try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(_){}
}
function toast(message){clearTimeout(timer);const t=$('#toast');t.textContent=message;t.hidden=false;timer=setTimeout(()=>{t.hidden=true;},3000);}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.group){
  const g=b.dataset.group,v=b.dataset.value;
  if(g==='drawing'){
   if(state.drawing.includes(v)){
    if(state.drawing.length===1){toast('至少保留一項圖面內容。');return;}
    state.drawing=state.drawing.filter(x=>x!==v);
   }else state.drawing=[...state.drawing,v];
  }else state[g]=v;
  render();
 }else if(b.dataset.lang){state.lang=b.dataset.lang;render();}
});
$('#extra').addEventListener('input',event=>{state.extra=event.target.value;render();});
$('#copyBtn').addEventListener('click',async()=>{
 const text=prompts[state.lang];
 try{if(!navigator.clipboard||!window.isSecureContext)throw Error('unavailable');await navigator.clipboard.writeText(text);toast('提示詞已複製。');}
 catch(_){
  const el=$('#prompt');el.focus();el.select();el.setSelectionRange(0,el.value.length);
  let ok=false;try{ok=document.execCommand('copy');}catch(_){}
  toast(ok?'提示詞已複製。':'已選取全文，請按 Ctrl+C、⌘C 或長按複製。');
 }
});
drawControls();render();
if('IntersectionObserver' in window){new IntersectionObserver(entries=>{for(const entry of entries)$('#mobileResult').hidden=entry.isIntersecting;},{threshold:.06}).observe($('#result'));}
</script>
</body>
</html>
